<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilote Stocks</title>
<meta name="description" content="Suivi des stocks d'un dépôt pétrolier : cuves, jaugeages, cargaisons, mouvements, facturation, paie et maintenance.">
<meta name="theme-color" content="#0B6E64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilote Stocks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Mise en page : barre latérale sombre (menu par domaines, groupes repliables), zone de travail claire ; sur téléphone, menu en tiroir et barre d'accès rapide en bas. */
:root{
  --bg:#F2F1EC; --surface:#FFFFFF; --sunk:#E9E7E0; --line:#D8D5CC; --ink:#1B1F23; --muted:#5D636A;
  --accent:#0B6E64; --accent-2:#08594F; --accent-ink:#FFFFFF; --accent-soft:#DAEDE9;
  --side:#14171A; --side-2:#1D2125; --side-ink:#D6DADD; --side-muted:#7E858C; --side-line:#2A2F34;
  --ok:#1B6E35; --ok-bg:#DFF0E3; --warn:#975500; --warn-bg:#F8ECD3; --bad:#AF241C; --bad-bg:#F9DEDA; --info:#2D5986; --info-bg:#E0E9F3;
  --in:#0B6E64; --out:#C06A00; --cif:#5C6BC0; --tube:#ECEAE4;
  --f-d:"Archivo","Arial Narrow",Arial,sans-serif; --f-b:"Public Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#191C1F; --sunk:#202428; --line:#30363B; --ink:#E6E8EA; --muted:#A1A8AF;
  --accent:#3FB2A4; --accent-2:#5CC4B7; --accent-ink:#06201C; --accent-soft:#153A35;
  --side:#0B0D0F; --side-2:#15181B; --side-ink:#D6DADD; --side-muted:#7E858C; --side-line:#23282C;
  --ok:#62C98A; --ok-bg:#16301F; --warn:#F0AA4C; --warn-bg:#3A2A12; --bad:#F3796D; --bad-bg:#3C1B18; --info:#86B3E2; --info-bg:#182A3D;
  --in:#3FB2A4; --out:#F0AA4C; --cif:#9FA8DA; --tube:#25292D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#191C1F; --sunk:#202428; --line:#30363B; --ink:#E6E8EA; --muted:#A1A8AF;
  --accent:#3FB2A4; --accent-2:#5CC4B7; --accent-ink:#06201C; --accent-soft:#153A35;
  --side:#0B0D0F; --side-2:#15181B; --side-ink:#D6DADD; --side-muted:#7E858C; --side-line:#23282C;
  --ok:#62C98A; --ok-bg:#16301F; --warn:#F0AA4C; --warn-bg:#3A2A12; --bad:#F3796D; --bad-bg:#3C1B18; --info:#86B3E2; --info-bg:#182A3D;
  --in:#3FB2A4; --out:#F0AA4C; --cif:#9FA8DA; --tube:#25292D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* ---- coque ---- */
#side{position:fixed;inset:0 auto 0 0;width:256px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--side-line)}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-d);font-size:17px;font-weight:800;letter-spacing:.02em;display:block;color:#fff}
.brand small{display:block;font-family:var(--f-m);font-size:10.5px;color:var(--side-muted);letter-spacing:.02em;line-height:1.3;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#menu{flex:1;overflow-y:auto;padding:8px 10px 16px;overscroll-behavior:contain}
.grp{margin-top:6px}
.grp-t{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;cursor:pointer;font-family:var(--f-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:8px 10px;border-radius:6px;text-align:left}
.grp-t:hover{color:var(--side-ink)}
.grp-t svg{width:14px;height:14px;transition:transform .15s}
.grp.closed .grp-t svg{transform:rotate(-90deg)}
.grp.closed .mi{display:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px}
.mi svg{width:17px;height:17px;flex:none;opacity:.75}
.mi:hover{background:var(--side-2)}
.mi:focus-visible,.grp-t:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mi.on{background:var(--accent);color:var(--accent-ink)}
.mi.on svg{opacity:1}
.mi .cnt{margin-left:auto;font-family:var(--f-m);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px}
.side-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--side-line);font-family:var(--f-m);font-size:10.5px;color:var(--side-muted)}
#main{margin-left:256px;min-height:100%;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 24px 10px;flex-wrap:wrap}
#burger{display:none}
.crumb{min-width:0;flex:1}
.crumb small{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{font-family:var(--f-d);font-weight:700;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px}
.tbtns{display:flex;align-items:center;gap:6px;position:relative}
.sync{font-family:var(--f-m);font-size:11px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.sync i.off{background:var(--warn)}
#view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
#banner:empty{display:none}
#banner{margin:14px 24px 0;padding:10px 14px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:13px;border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1452px}
#banner .btn{padding:4px 10px;font-size:12px}
/* ---- commandes ---- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.ib:focus-visible,.sq:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2)}
.btn.dan{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.sq{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.sq:hover{border-color:var(--accent)}
.sq svg{width:18px;height:18px}
.sq[disabled]{opacity:.5;cursor:not-allowed}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-family:var(--f-m);font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.badge:empty{display:none}
.ib{border:1px solid transparent;background:none;border-radius:6px;padding:5px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib svg{width:16px;height:16px}
.ib.pdf{color:var(--info);font-family:var(--f-m);font-size:11px;font-weight:600;gap:3px;display:inline-flex;align-items:center}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0;height:36px}
textarea.inp{height:auto}
.search{position:relative}
.search input{padding-left:32px;width:240px;max-width:100%}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
/* ---- notifications ---- */
#notif{position:absolute;right:0;top:44px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:45;padding:10px}
#notif h4{margin:2px 4px 8px;font-family:var(--f-d);font-size:14px;display:flex;justify-content:space-between;align-items:center}
/* ---- titres ---- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vh h1{font-family:var(--f-d);font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.vh p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-family:var(--f-d);font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.lbl{font-family:var(--f-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* ---- indicateurs ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
@media (min-width:1100px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.kpi .v{font-family:var(--f-d);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .ki{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.kpi .ki svg{width:16px;height:16px}
.kpi .ki~.lbl,.kpi .ki~.v{padding-right:34px}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)} .kpi.acc .v{color:var(--accent)} .kpi.warn .v{color:var(--warn)}
.kpi.acc .ki{background:var(--accent-soft);color:var(--accent)}
/* ---- panneaux et tableaux ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1100px){.grid2,.grid2.eq{grid-template-columns:minmax(0,1fr)}}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th{font-family:var(--f-m);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 9px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line)}
td.act{white-space:nowrap;text-align:right}
.code{font-family:var(--f-m);font-weight:600;font-size:12.5px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.sub{display:block;font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.mut{background:var(--sunk);color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-d);font-size:16px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--tube);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.rank:last-child{border-bottom:0}
.rank .bar{grid-column:2/4;height:6px}
.rank .n{font-family:var(--f-m);color:var(--muted);font-size:12px}
/* ---- cuves ---- */
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tank{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tank-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tank-h .lbl{display:block}
.tank-h h3{margin:2px 0 0;font-family:var(--f-d);font-size:18px;font-weight:700}
.tank-b{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px}
.tube{position:relative;height:208px;border:2px solid var(--line);border-radius:14px 14px 10px 10px;background:var(--tube);overflow:hidden}
.tube .fill{position:absolute;left:0;right:0;bottom:0;transition:height .4s}
.tube .tick{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--muted) 45%,transparent);font-family:var(--f-m);font-size:9.5px;color:var(--muted);padding-left:5px;z-index:1}
.tube .pct{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-d);font-weight:800;font-size:19px;z-index:2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tube .pct.lo{color:var(--ink);text-shadow:none}
.stats{display:flex;flex-direction:column;gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:7px 10px}
.stat b{display:block;font-family:var(--f-m);font-size:15px;font-weight:600}
.tank-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
/* ---- alertes, graphiques ---- */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;font-size:13px;border:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;width:100%}
.al:hover{border-color:var(--accent)}
.al .k{width:4px;align-self:stretch;border-radius:4px;flex:none}
.al.bad .k{background:var(--bad)} .al.warn .k{background:var(--warn)} .al.info .k{background:var(--info)}
.al small{display:block;color:var(--muted);font-family:var(--f-m);font-size:11px}
.chartbox{position:relative;height:290px}
.chartbox.sm{height:250px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.mv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.mv:last-child{border-bottom:0}
.lvl{display:grid;grid-template-columns:70px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12.5px}
/* ---- fenêtre de saisie ---- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,14,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 12px 30px;overflow-y:auto}
.dlg{background:var(--surface);border-radius:12px;width:100%;max-width:660px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-family:var(--f-d);font-size:17px}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:560px){.dlg-b{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font-family:var(--f-m);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld label i{color:var(--bad);font-style:normal}
.fld .inp{width:100%}
.fld textarea.inp{min-height:64px;resize:vertical}
.fld .h{font-size:11.5px;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk label{text-transform:none;letter-spacing:0;font-family:var(--f-b);font-size:13px;color:var(--ink)}
.live{grid-column:1/-1;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.live:empty{display:none}
.err{grid-column:1/-1;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px}
.err:empty{display:none}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
#toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#scrim{display:none}
#bnav{display:none}
/* ---- téléphone et tablette ---- */
@media (max-width:900px){
  #side{transform:translateX(-100%);width:280px} #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  #main{margin-left:0;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))} #burger{display:inline-grid}
  #top{padding-left:12px;padding-right:12px;gap:8px}
  .tools{order:9;flex-basis:100%}
  .tools .search{flex:1}.tools .search input{width:100%}
  .tools select{max-width:46%}
  .sync{display:none}
  #view{padding:16px 12px 32px;gap:14px} #banner{margin:12px 12px 0}
  .vh h1{font-size:21px}
  .tank-b{grid-template-columns:92px minmax(0,1fr)}
  .tube{height:180px}
  #toast{right:12px;left:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  #bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;border-radius:8px}
  #bnav button svg{width:20px;height:20px}
  #bnav button.on{color:var(--accent);font-weight:600}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

 dl:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

};
const ic=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${w?` width="${w}" height="${w}"`:''}>${I[k]}</svg>`;

/* ================================================================ configuration */
function applyCfg(){
  const c=IDX.config.get('general')||{};
  CFG=Object.assign({},CFG_DEF,c);
  TOL=num(CFG.tolerance)/100; HSE_MOIS=num(CFG.hse_mois)||12;
  const s=[CFG.site1,CFG.site2,CFG.site3].map(x=>String(x||'').trim()).filter(Boolean);
  D.cuves.forEach(cu=>{if(cu.site&&!s.includes(cu.site))s.push(cu.site)});
  if(s.join('|')!==SITES.join('|')){SITES.splice(0,SITES.length,...s);fillSites()}
  $('#brand-sub').textContent=CFG.nom||'Dépôt pétrolier';
}
function fillSites(){const el=$('#site');if(!el)return;if(S.site!=='all'&&!SITES.includes(S.site))S.site='all';
  el.innerHTML=`<option value="all">Tous les sites</option>`+SITES.map(s=>`<option${s===S.site?' selected':''}>${esc(s)}</option>`).join('')}

/* ================================================================ calculs métier */
const prodOfCuve=cu=>get('produits',cu?.produit);
const densP=p=>num(p?.densite)||1000;
const siteOk=cu=>S.site==='all'||cu?.site===S.site;
const isTruck=t=>t==='Chargement camion'||t==='Remplissage fûts';
const isInterne=t=>t==='Consommation interne'||t==='Transfert interne';
function cuveStock(cid,until,excl){
  const cu=get('cuves',cid); if(!cu) return 0; let s=0;
  if(!until||!cu.date_initial||cu.date_initial<=until) s+=num(cu.stock_initial);
  for(const r of D.receptions) if(r.cuve===cid&&(!until||(r.date||'')<=until)) s+=num(r.volume);
  for(const o of D.sorties) if(o.cuve===cid&&o.type!=='Livraison CIF'&&(!until||(o.date||'')<=until)) s-=num(o.volume);
  for(const j of D.jaugeages) if(j.cuve===cid&&j.valide&&j.id!==excl&&(!until||(j.date||'').slice(0,10)<=until)) s+=num(j.volume_mesure)-num(j.volume_theorique);
  return s;
}
function cuveInfo(cu){return memo('cu:'+cu.id,()=>{
  const p=prodOfCuve(cu), stock=cuveStock(cu.id), cap=num(cu.capacite);
  const pct=cap?Math.max(0,stock)/cap:0, mt=mtOf(stock,densP(p));
  const jj=D.jaugeages.filter(j=>j.cuve===cu.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const last=jj[0]; const seuil=(num(p?.seuil)||20)/100;
  const maint=D.maintenance.some(m=>m.cuve===cu.id&&m.statut==='En cours');
  const since=addDays(today(),-30);
  const out30=D.sorties.filter(o=>o.cuve===cu.id&&o.type!=='Livraison CIF'&&o.type!=='Transfert interne'&&(o.date||'')>since).reduce((a,o)=>a+num(o.volume),0);
  const jour=out30/30, auto=jour>0?Math.max(0,stock)/jour:null;
  let etat='ok',txt='Niveau correct';
  if(cu.statut&&cu.statut!=='Active'){etat='mut';txt=cu.statut}
  else if(maint){etat='info';txt='Intervention en cours'}
  else if(stock<-0.5){etat='bad';txt='Stock négatif : vérifier les saisies'}
  else if(pct<seuil){etat='bad';txt='Sous le seuil de sécurité'}
  else if(pct>0.95){etat='warn';txt='Presque pleine'}
  else if(auto!==null&&auto<num(CFG.rupture_jours)){etat='warn';txt='Rupture prévue sous '+fmt(Math.ceil(auto))+' j'}
  return {p,stock,cap,pct,mt,libre:Math.max(0,cap-stock),last,etat,txt,val:mt*num(p?.prix_ref),out30,jour,auto};
})}
function recInfo(r){const cu=get('cuves',r.cuve),p=prodOfCuve(cu);return {cu,p,mt:mtOf(r.volume,num(r.densite)||densP(p))}}
function sorInfo(o){return memo('so:'+o.id,()=>{
  const cu=get('cuves',o.cuve); const g=get('cargaisons',o.cargaison);
  const p=o.type==='Livraison CIF'?get('produits',o.produit)||get('produits',get('commandes',g?.commande)?.produit):prodOfCuve(cu);
  return {cu,g,p,mt:mtOf(o.volume,num(o.densite)||densP(p)),site:o.type==='Livraison CIF'?SITES[0]:cu?.site};
})}
function cgoInfo(g){
  const cmd=get('commandes',g.commande), p=get('produits',cmd?.produit);
  let duree=null,hsur=null,msur=0;
  if(g.nor&&g.fin){duree=(new Date(g.fin)-new Date(g.nor))/36e5;hsur=Math.max(0,duree-num(g.planche));msur=hsur/24*num(g.taux)}
  const bl=num(g.bl_mt),t=num(g.terre_mt);const ecart=t&&bl?bl-t:null;const ecp=ecart!==null?ecart/bl:null;
  return {cmd,p,duree,hsur,msur,ecart,ecp,alerte:ecp!==null&&Math.abs(ecp)>TOL,val:ecart!==null?ecart*num(cmd?.prix):0};
}
function cmdInfo(c){
  const recu=D.cargaisons.filter(g=>g.commande===c.id).reduce((a,g)=>a+num(g.bl_mt),0);
  const paye=D.paiements.filter(p=>p.sens==='Décaissement'&&p.commande===c.id).reduce((a,p)=>a+num(p.montant),0);
  const q=num(c.quantite),montant=q*num(c.prix);
  const statut=recu===0?(c.fen1&&c.fen1>today()?['Navire attendu','info']:['En attente','mut']):Math.abs(recu-q)<=q*0.05?['Livrée','ok']:['Écart de quantité','warn'];
  return {recu,paye,montant,statut};
}
const UNITES=['MT','m³','Litre','Fût'];
function qtyU(o,u){const s=sorInfo(o);return u==='m³'?num(o.volume):u==='Litre'?num(o.volume)*1000:u==='Fût'?num(o.nb_futs):s.mt}
function facCalc(f){
  const lignes=D.sorties.filter(o=>o.facture===f.id);const p=get('produits',f.produit);const u=p?.unite||'MT';
  const qte=lignes.reduce((a,o)=>a+qtyU(o,u),0), vol=lignes.reduce((a,o)=>a+num(o.volume),0), mt=lignes.reduce((a,o)=>a+sorInfo(o).mt,0);
  const brut=qte*num(f.prix), rem=brut*num(f.remise)/100, ht=brut-rem, tva=ht*num(f.tva)/100, ttc=ht+tva;
  const paye=D.paiements.filter(x=>x.sens==='Encaissement'&&x.facture===f.id).reduce((a,x)=>a+num(x.montant),0);
  const cl=get('clients',f.client); const ech=addDays(f.date,num(cl?.delai)||30); const solde=ttc-paye;
  let st=['À échoir','info'];
  if(!lignes.length) st=['Sans livraison','mut']; else if(solde<=0.5) st=['Payée','ok']; else if(today()>ech) st=['Échue','bad']; else if(paye>0) st=['Partiellement payée','warn'];
  return {lignes,u,qte,vol,mt,brut,rem,ht,tva,ttc,paye,solde,ech,cl,st};
}
function facInfo(f){return f&&get('factures',f.id)===f?memo('fa:'+f.id,()=>facCalc(f)):facCalc(f)}
function jauInfo(j){const cu=get('cuves',j.cuve),p=prodOfCuve(cu);const e=num(j.volume_mesure)-num(j.volume_theorique);const ep=num(j.volume_theorique)?e/num(j.volume_theorique):0;return {cu,p,e,ep,emt:mtOf(e,densP(p)),val:mtOf(e,densP(p))*num(p?.prix_ref),hors:Math.abs(ep)>TOL}}
function chfInfo(c){
  const t=today();const permis=c.permis_validite&&c.permis_validite>=t;const hse=c.hse_date&&addMonths(c.hse_date,HSE_MOIS)>=t;
  return {rot:D.sorties.filter(o=>o.chauffeur===c.id).length,permis,hse,ok:permis&&hse,hseFin:c.hse_date?addMonths(c.hse_date,HSE_MOIS):''};
}
function camInfo(c){const cert=c.cert_validite&&c.cert_validite>=today();return {rot:D.sorties.filter(o=>o.camion===c.id).length,cert,ok:c.statut!=='Suspendu'&&cert}}
function cliInfo(c){return memo('cl:'+c.id,()=>{
  const vol=D.sorties.filter(o=>o.client===c.id).reduce((a,o)=>a+sorInfo(o).mt,0);
  let ca=0,solde=0;D.factures.filter(f=>f.client===c.id).forEach(f=>{const i=facInfo(f);ca+=i.ttc;solde+=i.solde});
  return {vol,ca,solde};
})}
function paieInfo(r){const brut=num(r.base)+num(r.primes)+num(r.heures_sup);const ret=num(r.deductions)+num(r.avance);return {brut,ret,net:brut-ret,e:get('employes',r.employe)}}
function alerts(){return memo('alerts',()=>{
  const A=[];
  D.cuves.filter(siteOk).forEach(cu=>{const i=cuveInfo(cu);if(i.etat==='bad')A.push(['bad',`Cuve ${cu.code} : ${i.txt.toLowerCase()} (${fmt(i.pct*100,0)} %)`,'cuves']);
    else if(i.etat==='warn'&&i.pct>0.95)A.push(['warn',`Cuve ${cu.code} presque pleine (${fmt(i.pct*100,0)} %)`,'cuves']);
    else if(i.etat==='warn')A.push(['warn',`Cuve ${cu.code} : rupture prévue dans ${fmt(Math.ceil(i.auto))} jours au rythme des 30 derniers jours`,'analyse'])});
  D.cargaisons.forEach(g=>{const i=cgoInfo(g);if(i.alerte)A.push(['bad',`Cargaison ${g.numero} : écart de transport ${fmt(i.ecp*100,2)} %`,'cargaisons']);if(g.qualite&&g.qualite!=='Conforme')A.push(['warn',`Cargaison ${g.numero} : contrôle qualité ${g.qualite.toLowerCase()}`,'cargaisons'])});
  D.jaugeages.forEach(j=>{const i=jauInfo(j);if(i.hors&&!j.cause)A.push(['warn',`Jaugeage de ${i.cu?.code||'?'} du ${fd(j.date)} hors tolérance : cause à renseigner`,'pertes'])});
  D.factures.forEach(f=>{const i=facInfo(f);if(i.st[0]==='Échue')A.push(['bad',`Facture ${f.numero} échue depuis le ${fd(i.ech)} : ${cur(i.solde)}`,'factures'])});
  const m0=thisMonth()+'-01';const nf=D.sorties.filter(o=>!o.facture&&!isInterne(o.type)&&(o.date||'')<m0).length;if(nf)A.push(['warn',`${nf} sortie(s) des mois précédents non facturée(s)`,'sorties']);
  D.camions.forEach(c=>{const i=camInfo(c);if(!i.cert&&c.statut!=='Suspendu')A.push(['warn',`Camion ${c.immat} : certificat expiré`,'camions'])});
  D.chauffeurs.forEach(c=>{const i=chfInfo(c);if(!i.ok)A.push(['warn',`Chauffeur ${c.nom} : ${!i.permis?'permis expiré':'formation HSE à renouveler'}`,'chauffeurs'])});
  D.maintenance.forEach(m=>{if(m.statut==='Planifiée'&&m.echeance&&m.echeance<=addDays(today(),15))A.push([m.echeance<today()?'bad':'warn',`Maintenance ${m.numero} ${m.echeance<today()?'en retard depuis le':'prévue le'} ${fd(m.echeance)} : ${m.description||m.type}`,'maintenance'])});
  return A;
})}

/* ================================================================ composants */
function vh(title,desc,acts=''){return `<div class="vh"><div><h1>${esc(title)}</h1>${desc?`<p>${desc}</p>`:''}</div><div class="acts">${acts}</div></div>`}
function addBtn(c,label){return canWrite&&db?`<button class="btn pri" data-add="${c}">${ic('plus')}${esc(label)}</button>`:''}
function kpi(l,v,s,k='',i=''){return `<div class="kpi ${k}">${i?`<span class="ki">${ic(i)}</span>`:''}<span class="lbl">${esc(l)}</span><span class="v">${v}</span>${s?`<span class="s">${s}</span>`:''}</div>`}
function emptyDb(){
  if(dbState==='loading')return `<div class="panel empty"><b>Chargement des données…</b>Connexion à la base.</div>`;
  if(dbState==='absent')return `<div class="panel empty"><b>Base de données indisponible</b>Le serveur ne répond pas. Vérifiez qu'il est démarré.</div>`;
  return '';
}
function rowActs(coll,r){
  const def=L[coll];let h='';
  if(def.pdf)h+=def.pdf.map(([k,t])=>`<button class="ib pdf" data-pdf="${k}" data-coll="${coll}" data-id="${esc(r.id)}" title="Télécharger : ${esc(t)}">${ic('dl',14)}${esc(t)}</button>`).join('');
  if(canWrite&&db){
    if(coll==='receptions'&&r.sortie)h+=`<span class="chip mut" title="Créée par le transfert ${esc(get('sorties',r.sortie)?.numero||'')} : modifiez le transfert">Auto</span>`;
    else h+=`<button class="ib" data-edit="${coll}" data-id="${esc(r.id)}" title="Modifier">${ic('edit')}</button><button class="ib" data-del="${coll}" data-id="${esc(r.id)}" title="Supprimer">${ic('del')}</button>`;
  }
  return h;
}
function table(coll,rows){
  const def=L[coll];const q=S.q.trim().toLowerCase();
  if(!rows.length)return `<div class="panel empty"><b>Aucun enregistrement</b>${canWrite&&db?`Utilisez le bouton « Ajouter » pour créer le premier.`:''}</div>`;
  let body=rows.slice().sort(def.sort);
  if(q)body=body.filter(r=>def.cols.map(c=>strip(c[1](r))).join(' ').toLowerCase().includes(q));
  if(!body.length)return `<div class="panel empty"><b>Aucun résultat pour « ${esc(S.q)} »</b>Modifiez la recherche en haut de page.</div>`;
  const n=body.length;const shown=body.slice(0,S.limit);const heads=def.cols.map(c=>T(c[0]));
  return `<div class="tw"><table class="rt"><thead><tr>${heads.map((h,i)=>`<th class="${def.cols[i][2]||''}">${esc(h)}</th>`).join('')}<th class="num">Actions</th></tr></thead><tbody>${
    shown.map(r=>`<tr>${def.cols.map((c,i)=>`<td class="${c[2]||''}" data-l="${esc(heads[i])}"><div>${c[1](r)}</div></td>`).join('')}<td class="act">${rowActs(coll,r)}</td></tr>`).join('')
  }</tbody></table>${n>S.limit?`<div class="more"><button class="btn" data-more>Afficher ${fmt(Math.min(100,n-S.limit))} de plus (${fmt(n-S.limit)} restants)</button></div>`:''}</div>`;
}

/* ---------------------------------------------------------------- flux : séries temporelles */
const isFluxOut=o=>o.type!=='Livraison CIF'&&o.type!=='Transfert interne';
const isFluxIn=r=>r.provenance!=='Transfert interne';
function buckets(period){
  const t=today();let keys=[],keyOf,label;
  if(period===30){for(let i=29;i>=0;i--)keys.push(addDays(t,-i));keyOf=d=>d;label=k=>k.slice(8,10)+'/'+k.slice(5,7)}
  else if(period===90){const start=addDays(t,-90);const w0=d=>Math.floor(daysBetween(start,d)/7);for(let i=0;i<=12;i++)keys.push(i);keyOf=d=>d<=start?-1:Math.min(12,w0(d));label=k=>{const a=addDays(start,k*7+1);return a.slice(8,10)+'/'+a.slice(5,7)}}
  else{const all=[...D.receptions.map(r=>r.date),...D.sorties.map(o=>o.date)].filter(Boolean).sort();const first=(all[0]||t).slice(0,7);let m=first;while(m<=t.slice(0,7)&&keys.length<36){keys.push(m);const d=new Date(m+'-15T12:00:00');d.setMonth(d.getMonth()+1);m=iso(d).slice(0,7)}keyOf=d=>d.slice(0,7);label=k=>MCOURT[+k.slice(5,7)-1]+' '+k.slice(2,4)}
  return {keys,keyOf,label,since:period?addDays(t,-period):'0000'};
}
function fluxSeries(period){
  const b=buckets(period);const ix=new Map(b.keys.map((k,i)=>[k,i]));const z=()=>b.keys.map(()=>0);const ins=z(),outs=z(),cif=z();
  D.receptions.forEach(r=>{if(!r.date||r.date<=b.since||!isFluxIn(r)||!siteOk(get('cuves',r.cuve)))return;const i=ix.get(b.keyOf(r.date));if(i!==undefined)ins[i]+=recInfo(r).mt});
  D.sorties.forEach(o=>{if(!o.date||o.date<=b.since)return;const s=sorInfo(o);if(S.site!=='all'&&s.site!==S.site)return;const i=ix.get(b.keyOf(o.date));if(i===undefined)return;if(o.type==='Livraison CIF')cif[i]+=s.mt;else if(isFluxOut(o))outs[i]+=s.mt});
  return {labels:b.keys.map(b.label),ins,outs,cif};
}

/* ---------------------------------------------------------------- analyse des stocks */
function anaData(){return memo('ana:'+S.aper,()=>{
  const t=today(),per=S.aper,since=addDays(t,-per);
  const cu=D.cuves.filter(siteOk);const rows=[];
  D.produits.slice().sort((a,b)=>(a.categorie||'').localeCompare(b.categorie||'')||(a.code||'').localeCompare(b.code||'')).forEach(p=>{
    const cs=cu.filter(c=>c.produit===p.id);if(!cs.length)return;const ids=new Set(cs.map(c=>c.id));
    const stock=cs.reduce((a,c)=>a+Math.max(0,cuveInfo(c).mt),0),cap=cs.reduce((a,c)=>a+num(c.capacite),0)*densP(p)/1000;
    const ins=D.receptions.filter(r=>ids.has(r.cuve)&&isFluxIn(r)&&r.date>since).reduce((a,r)=>a+recInfo(r).mt,0);
    const outs=D.sorties.filter(o=>ids.has(o.cuve)&&isFluxOut(o)&&o.date>since).reduce((a,o)=>a+sorInfo(o).mt,0);
    const st0=cs.reduce((a,c)=>a+Math.max(0,mtOf(cuveStock(c.id,since),densP(p))),0);
    const ec=D.jaugeages.filter(j=>ids.has(j.cuve)&&j.valide&&(j.date||'').slice(0,10)>since).reduce((a,j)=>a+jauInfo(j).emt,0);
    const jour=outs/per, auto=jour>0?stock/jour:null, moy=(stock+st0)/2, rot=moy>0?outs/moy:0;
    const etat=!outs?['Sans mouvement','mut']:auto<num(CFG.rupture_jours)?['Rupture imminente','bad']:auto<2*num(CFG.rupture_jours)?['À surveiller','warn']:['Correct','ok'];
    rows.push({p,stock,cap,ins,outs,jour,auto,rot,ec,val:stock*num(p.prix_ref),etat,freinte:ins?ec/ins:0});
  });
  const tot=rows.reduce((a,r)=>{['stock','ins','outs','ec','val','cap'].forEach(k=>a[k]+=r[k]);return a},{stock:0,ins:0,outs:0,ec:0,val:0,cap:0});
  const sur=D.cargaisons.filter(g=>(g.nor||'').slice(0,10)>since).reduce((a,g)=>a+cgoInfo(g).msur,0);
  const ecv=D.jaugeages.filter(j=>(j.date||'').slice(0,10)>since&&siteOk(get('cuves',j.cuve))).reduce((a,j)=>a+jauInfo(j).val,0);
  const cl={};D.sorties.filter(o=>o.client&&o.date>since&&(S.site==='all'||sorInfo(o).site===S.site)).forEach(o=>{cl[o.client]=(cl[o.client]||0)+sorInfo(o).mt});
  const top=Object.entries(cl).map(([k,v])=>({c:get('clients',k),mt:v})).filter(x=>x.c).sort((a,b)=>b.mt-a.mt);
  return {rows,tot,sur,ecv,top,since};
})}
function monthly(n=12){
  const t=today();const ms=[];let d=new Date(t.slice(0,7)+'-15T12:00:00');for(let i=0;i<n;i++){ms.unshift(iso(d).slice(0,7));d.setMonth(d.getMonth()-1)}
  return ms.map(m=>{const inM=s=>(s||'').slice(0,7)===m;
    const r={m,ins:0,outs:0,cif:0,ec:0,fac:0,enc:0,ach:0,dep:0,sal:0};
    D.receptions.forEach(x=>{if(inM(x.date)&&isFluxIn(x))r.ins+=recInfo(x).mt});
    D.sorties.forEach(o=>{if(!inM(o.date))return;const s=sorInfo(o);if(o.type==='Livraison CIF')r.cif+=s.mt;else if(isFluxOut(o))r.outs+=s.mt});
    D.jaugeages.forEach(j=>{if(j.valide&&inM(j.date))r.ec+=jauInfo(j).emt});
    D.factures.forEach(f=>{if(inM(f.date))r.fac+=facInfo(f).ttc});
    D.paiements.forEach(p=>{if(!inM(p.date))return;if(p.sens==='Encaissement')r.enc+=num(p.montant);else r.ach+=num(p.montant)});
    D.depenses.forEach(x=>{if(inM(x.date))r.dep+=num(x.montant)});
    D.paie.forEach(p=>{if(p.periode===m)r.sal+=paieInfo(p).net});
    return r}).filter((r,i,a)=>i===a.length-1||Object.keys(r).some(k=>k!=='m'&&Math.abs(r[k])>0.0001));
}

  let y=kv(d,38,[['Date',fd(o.date)],['Type de sortie',o.type],['Client',get('clients',o.client)?.nom||(o.type==='Transfert interne'?'Vers '+(get('cuves',o.cuve_dest)?.code||''):'Interne')],['Produit',i.p?.nom||''],[o.type==='Livraison CIF'?'Cargaison':'Cuve source',o.type==='Livraison CIF'?((i.g?.numero||'')+' · '+(i.g?.navire||'')):(i.cu?.code||'')],
   ['Camion',get('camions',o.camion)?.immat||'–'],['Chauffeur',get('chauffeurs',o.chauffeur)?.nom||'–'],['Nombre de fûts',o.nb_futs?pf(o.nb_futs):'–'],['Volume (m³ à 15 °C)',pf(o.volume,3)],['Densité à 15 °C',pf(num(o.densite)||densP(i.p),1)+' kg/m³'],['Quantité (MT)',pf(i.mt,3)],['N° de bon',o.bon||'–'],['Opérateur',o.operateur||'–']]);
  y+=10;d.setDrawColor(180,180,180);['Le dépôt','Le transporteur','Le client'].forEach((t,k)=>{const x=14+k*62;d.rect(x,y,58,30);d.setFont('helvetica','normal');d.setFontSize(9);d.text(t+' (nom, signature)',x+2,y+5)});
  save(`Bon_${o.numero||'sortie'}.pdf`,d.output('arraybuffer'),'application/pdf');
}
function pdfTicket(coll,r){
  const isS=coll==='sorties';const i=isS?sorInfo(r):recInfo(r);
  const L2=[['N°',r.numero],['Date',fd(r.date)],['Produit',i.p?.nom||'']];
  if(isS){L2.push(['Type',r.type]);if(r.type==='Livraison CIF')L2.push(['Navire',i.g?.navire||'']);else L2.push(['Cuve',i.cu?.code||'']);
    if(r.client)L2.push(['Client',get('clients',r.client)?.nom||'']);if(r.type==='Transfert interne')L2.push(['Vers cuve',get('cuves',r.cuve_dest)?.code||'']);
    if(r.camion)L2.push(['Camion',get('camions',r.camion)?.immat||'']);if(r.chauffeur)L2.push(['Chauffeur',get('chauffeurs',r.chauffeur)?.nom||'']);if(r.nb_futs)L2.push(['Fûts',pf(r.nb_futs)]);if(r.bon)L2.push(['Bon',r.bon])}
  else{L2.push(['Provenance',r.provenance||'']);L2.push(['Cuve',i.cu?.code||'']);if(r.camion)L2.push(['Camion',r.camion]);if(r.temperature!=null&&r.temperature!=='')L2.push(['Température',pf(r.temperature,1)+' °C']);L2.push(['Qualité',r.qualite||''])}
  const Q=[['Volume 15 °C',pf(r.volume,3)+' m3'],['Densité 15 °C',pf(num(r.densite)||densP(i.p),1)],['Quantité',pf(i.mt,3)+' MT']];
  const h=70+(L2.length+Q.length)*5+40;const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:[80,h]});
  let y=8;const c=40;d.setFont('courier','bold');d.setFontSize(10);d.splitTextToSize(pt(CFG.nom||'Dépôt'),70).forEach(l=>{d.text(l,c,y,{align:'center'});y+=4.5});
  d.setFont('courier','normal');d.setFontSize(7.5);if(CFG.adresse){d.splitTextToSize(pt(CFG.adresse),70).forEach(l=>{d.text(l,c,y,{align:'center'});y+=3.5})}
  const rule=()=>{y+=1;d.setLineDashPattern([1,1],0);d.line(5,y,75,y);y+=4.5};rule();
  d.setFont('courier','bold');d.setFontSize(10);d.text(isS?'TICKET DE SORTIE':'TICKET DE RECEPTION',c,y,{align:'center'});y+=5;d.setFontSize(8);
  const line=([k,v],b)=>{d.setFont('courier',b?'bold':'normal');const t=d.splitTextToSize(pt(v),44);d.text(pt(k),5,y);t.forEach((l,n)=>{d.text(l,75,y+n*3.6,{align:'right'})});y+=Math.max(1,t.length)*3.6+1.2};
  rule();L2.forEach(x=>line(x));rule();Q.forEach((x,k)=>line(x,k===2));rule();
  line(['Opérateur',r.operateur||'–']);line(['Imprimé le',fd(today())+' '+nowDT().slice(11)]);y+=4;
  d.setFont('courier','normal');d.text(isS?'Signature chauffeur :':'Signature livreur :',5,y);y+=12;d.text('Signature dépôt :',5,y);y+=10;rule();
  d.setFontSize(6.5);d.text('Document de travail - Pilote Stocks',c,y,{align:'center'});
  save(`Ticket_${r.numero||coll}.pdf`,d.output('arraybuffer'),'application/pdf');
}
function pdfFacture(f){
  const i=facInfo(f);const p=get('produits',f.produit);const d=pdfDoc('FACTURE PROFORMA',f.numero||'');
  let y=kv(d,38,[['Client',i.cl?.nom||''],['Adresse',i.cl?.adresse||'–'],['Date d\'émission',fd(f.date)],['Échéance',fd(i.ech)],['Produit',(p?.nom||'')+' · facturé en '+i.u]]);
  y+=4;d.setFillColor(235,235,230);d.rect(14,y,182,8,'F');d.setFont('helvetica','bold');d.setFontSize(9);
  const X=[16,40,74,130,160,194];['Date','N° sortie','Origine','Volume (m³)','Tonnes (MT)','Quantité ('+i.u+')'].forEach((h,k)=>d.text(pt(h),X[k],y+5.5,k>=3?{align:'right'}:undefined));y+=13;
  d.setFont('helvetica','normal');i.lignes.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(o=>{if(y>230){d.addPage();y=20}const s=sorInfo(o);d.text(fd(o.date),X[0],y);d.text(pt(o.numero||''),X[1],y);d.text(pt(o.type==='Livraison CIF'?'CIF '+(s.g?.navire||''):'Cuve '+(s.cu?.code||'')),X[2],y);d.text(pf(o.volume,3),X[3],y,{align:'right'});d.text(pf(s.mt,3),X[4],y,{align:'right'});d.text(pf(qtyU(o,i.u),i.u==='Fût'?0:3),X[5],y,{align:'right'});y+=6});
  if(y>220){d.addPage();y=20}
  y+=4;d.line(110,y,196,y);y+=7;
  const tot=[['Quantité totale',pf(i.qte,i.u==='Fût'?0:3)+' '+i.u],['Prix unitaire',pc(f.prix)+' / '+i.u],['Montant brut',pc(i.brut)]];
  if(num(f.remise))tot.push([`Remise (${pf(f.remise,1)} %)`,'- '+pc(i.rem)]);
  tot.push(['Total HT',pc(i.ht)],[`TVA (${pf(f.tva,1)} %)`,pc(i.tva)],['Total TTC',pc(i.ttc)],['Déjà réglé',pc(i.paye)],['Reste à payer',pc(i.solde)]);
  tot.forEach(([k,v])=>{const b=k==='Total TTC'||k==='Reste à payer';d.setFont('helvetica',b?'bold':'normal');d.text(pt(k),112,y);d.text(pt(v),194,y,{align:'right'});y+=6.5});
  if(f.note){y+=6;d.setFont('helvetica','normal');d.text(d.splitTextToSize(pt('Observations : '+f.note),182),14,y)}
  save(`Facture_${f.numero||'proforma'}.pdf`,d.output('arraybuffer'),'application/pdf');
}
function pdfBulletin(r){
  const i=paieInfo(r);const e=i.e||{};const d=pdfDoc('BULLETIN DE PAIE',r.numero||'');
  d.setFontSize(11);d.setFont('helvetica','bold');d.text('Période : '+pt(fm(r.periode)),14,38);
  let y=kv(d,48,[['Employé',e.nom||''],['Matricule',e.matricule||''],['Fonction',e.fonction||''],['Service',e.service||''],['Date d\'embauche',fd(e.date_embauche)]],60);
  y+=4;d.setFillColor(235,235,230);d.rect(14,y,182,8,'F');d.setFont('helvetica','bold');d.setFontSize(9.5);d.text('Rubrique',16,y+5.5);d.text('Gains',150,y+5.5,{align:'right'});d.text('Retenues',194,y+5.5,{align:'right'});y+=14;
  const ln=(k,g,rt,b)=>{d.setFont('helvetica',b?'bold':'normal');d.text(pt(k),16,y);if(g!==null)d.text(pc(g),150,y,{align:'right'});if(rt!==null)d.text(pc(rt),194,y,{align:'right'});y+=7};
  ln('Salaire de base',num(r.base),null);if(num(r.primes))ln('Primes',num(r.primes),null);if(num(r.heures_sup))ln('Heures supplémentaires',num(r.heures_sup),null);
  d.line(14,y-4,196,y-4);ln('Salaire brut',i.brut,null,true);ln('Retenues et cotisations',null,num(r.deductions));if(num(r.avance))ln('Avance sur salaire',null,num(r.avance));
  y+=3;d.setFillColor(218,237,233);d.rect(14,y-5,182,10,'F');d.setFont('helvetica','bold');d.setFontSize(11);d.text('NET À PAYER',16,y+1.5);d.text(pc(i.net),194,y+1.5,{align:'right'});y+=16;
  d.setFontSize(9.5);y=kv(d,y,[['Date de paiement',fd(r.date_paiement)],['Statut',r.statut||'']],60);
  if(r.note){d.setFont('helvetica','normal');d.text(d.splitTextToSize(pt('Observations : '+r.note),182),14,y+4)}
  y=Math.max(y+20,210);d.setDrawColor(180,180,180);['L\'employeur','L\'employé'].forEach((t,k)=>{const x=14+k*94;d.rect(x,y,88,28);d.setFont('helvetica','normal');d.setFontSize(9);d.text(t+' (signature)',x+2,y+5)});
  save(`Bulletin_${(e.matricule||'')}_${r.periode||''}.pdf`,d.output('arraybuffer'),'application/pdf');
}
function doPdf(kind,coll,id){
  if(!window.jspdf){toast('Module PDF non chargé.');return}const r=get(coll,id);if(!r)return;
  try{if(kind==='bon')pdfBon(r);else if(kind==='ticket')pdfTicket(coll,r);else if(kind==='facture')pdfFacture(r);else if(kind==='bulletin')pdfBulletin(r)}catch(e){console.error(e);toast('Impossible de produire le PDF.')}
}
async function genPaie(){
  const per=thisMonth();const emp=D.employes.filter(e=>e.statut!=='Sorti'&&!D.paie.some(p=>p.employe===e.id&&p.periode===per));
  if(!emp.length){toast('Toutes les fiches de '+fm(per)+' existent déjà.');return}
  confirmBox('Préparer la paie de '+fm(per)+' ?',`${emp.length} fiche(s) seront créées en <b>brouillon</b>, avec le salaire de base et ${fmt(CFG.retenue,1)} % de retenues. Vous pourrez ensuite ajouter primes, heures supplémentaires et avances.`,'Créer les fiches',async()=>{
    const y=new Date().getFullYear(),p=`PAIE-${y}-`;let m=0;D.paie.forEach(r=>{if(r.numero&&r.numero.startsWith(p))m=Math.max(m,parseInt(r.numero.slice(p.length))||0)});
    for(const e of emp){let id='paie-'+per+'-'+e.id;if(IDX.paie.has(id))id=rid();m++;
      await db.collection('paie').doc(id).set({numero:p+String(m).padStart(4,'0'),employe:e.id,periode:per,base:num(e.salaire),primes:0,heures_sup:0,deductions:Math.round(num(e.salaire)*num(CFG.retenue))/100,avance:0,date_paiement:null,statut:'Brouillon',maj:new Date().toISOString()})}
    toast(emp.length+' fiche(s) de paie préparée(s).')},false);
}

  if(t.dataset.r)go(t.dataset.r);
  else if(t.dataset.go)go(t.dataset.go);
  else if(t.dataset.add)openForm(t.dataset.add,null);
  else if(t.dataset.edit)openForm(t.dataset.edit,get(t.dataset.edit,t.dataset.id));
  else if(t.dataset.del)askDelete(t.dataset.del,t.dataset.id);
  else if(t.hasAttribute('data-close'))closeModal();
  else if(t.dataset.per!==undefined){S.period=+t.dataset.per;render()}
  else if(t.dataset.aper!==undefined){S.aper=+t.dataset.aper;render()}
  else if(t.dataset.jauger){openForm('jaugeages',null,{cuve:t.dataset.jauger})}
  else if(t.dataset.pdf)doPdf(t.dataset.pdf,t.dataset.coll,t.dataset.id);
  else if(t.dataset.grp){const g=t.dataset.grp;CLOSED.has(g)?CLOSED.delete(g):CLOSED.add(g);try{localStorage.setItem('ps_grp',JSON.stringify([...CLOSED]))}catch(x){}t.parentElement.classList.toggle('closed');t.setAttribute('aria-expanded',String(!t.parentElement.classList.contains('closed')))}
  else if(t.dataset.menu){$('#side').classList.add('open');$('#scrim').classList.add('on')}
  else if(t.hasAttribute('data-more')){S.limit+=100;render()}
  else if(t.hasAttribute('data-bell')){window.scrollTo(0,0);toggleNotif(true)}
  else if(t.hasAttribute('data-closenotif'))closeNotif();
  else if(t.dataset.sys)sysAction(t.dataset.sys);
});
function sysAction(a){
  if(a==='nobanner'){S.nobanner=true;try{sessionStorage.setItem('ps_nobanner','1')}catch(e){}render();return}
  if(!db)return;
  if(a==='backup'){save(`pilote-stocks-sauvegarde-${today()}.json`,JSON.stringify(db.dump(),null,1),'application/json');toast('Sauvegarde téléchargée.')}
  else if(a==='restore')$('#restfile').click();
  else if(a==='xlmois')exportMonthly();
  else if(a==='genpaie')genPaie();
  else if(a==='demo')confirmBox('Charger les données d\'exemple ?','Les données actuelles seront <b>remplacées</b> par un jeu de données fictives. Téléchargez une sauvegarde avant si besoin.','Charger les exemples',async()=>{await db.replaceAll(demoData());toast('Données d\'exemple chargées.')});
  else if(a==='wipe')confirmBox('Vider toute la base ?',`Toutes les données seront supprimées${MODE==='serveur'?' pour tous les utilisateurs':''}. La configuration du dépôt est conservée. Cette action est définitive sans sauvegarde.`,'Tout supprimer',async()=>{const c=Object.assign({},IDX.config.get('general')||{});delete c.id;delete c.demo;await db.replaceAll({config:{general:Object.assign(c,{maj:new Date().toISOString()})}});toast('Base vidée.')});
}

/* ================================================================ stockage : serveur partagé ou navigateur */
let MODE='local',online=true;
function demoData(){ /* données fictives, dates recalées sur aujourd'hui */
  const src=window.EXEMPLE||{};const ref=window.EXEMPLE_REF||today();const n=daysBetween(ref,today());
  const sh=s=>addDays(s.slice(0,10),n)+s.slice(10);const shM=p=>addDays(p+'-15',n).slice(0,7);
  const out={};Object.entries(src).forEach(([c,docs])=>{out[c]={};Object.entries(docs).forEach(([id,d])=>{const o={};Object.entries(d).forEach(([k,v])=>{
    o[k]=typeof v==='string'&&k==='periode'&&/^\d{4}-\d{2}$/.test(v)?shM(v):typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v)&&k!=='numero'?sh(v):v});out[c][id]=o})});
  return out;
}
const snapOf=(cache,c)=>({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,data:()=>d}))});
function hub(){const subs={};return {subs,emit:(cache,c)=>(subs[c]||[]).forEach(f=>f(snapOf(cache,c))),all(cache){Object.keys(subs).forEach(c=>this.emit(cache,c))}}}
function serverDb(){
  const h=hub();let cache=null;
  const es=new EventSource('api/events');
  es.onmessage=e=>{const m=JSON.parse(e.data);online=true;if(m.type==='full'){cache=m.data;h.all(cache)}else if(cache){cache[m.coll]=cache[m.coll]||{};if(m.doc)cache[m.coll][m.id]=m.doc;else delete cache[m.coll][m.id];h.emit(cache,m.coll)}};
  es.onerror=()=>{online=false;schedule()};
  const call=async(method,c,id,d)=>{let r;try{r=await fetch(`api/${c}/${encodeURIComponent(id)}`,{method,headers:{'Content-Type':'application/json'},body:d?JSON.stringify(d):undefined})}catch(e){throw {code:'unavailable'}}if(!r.ok)throw {code:r.status===401||r.status===403?'invalid_argument':'unavailable'}};
  return {collection:c=>({onSnapshot(n){(h.subs[c]=h.subs[c]||[]).push(n);if(cache)n(snapOf(cache,c));return ()=>{}},doc:id=>({set:d=>call('PUT',c,id,d),delete:()=>call('DELETE',c,id)})}),
    async replaceAll(data){const r=await fetch('api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,mode:'replace'})});if(!r.ok)throw new Error('import')},
    dump:()=>cache||{}};
}
function localDb(){
  const KEY='pilote_stocks_donnees_v1';const h=hub();let cache={};let first=false;
  const read=()=>{try{const s=localStorage.getItem(KEY);first=s===null;cache=JSON.parse(s||'{}')||{}}catch(e){first=true;cache={}}};
  const write=()=>{try{localStorage.setItem(KEY,JSON.stringify(cache))}catch(e){toast('Le navigateur refuse d\'enregistrer : espace plein ou stockage bloqué.')}};
  read();if(first&&window.EXEMPLE){cache=demoData();write()}
  window.addEventListener('storage',e=>{if(e.key===KEY){read();h.all(cache)}});
  return {collection:c=>({onSnapshot(n){(h.subs[c]=h.subs[c]||[]).push(n);setTimeout(()=>n(snapOf(cache,c)),0);return ()=>{}},
      doc:id=>({set:async d=>{(cache[c]=cache[c]||{})[id]=d;write();h.emit(cache,c)},delete:async()=>{if(cache[c])delete cache[c][id];write();h.emit(cache,c)}})}),
    async replaceAll(data){cache=JSON.parse(JSON.stringify(data));write();COLLS.forEach(c=>h.emit(cache,c))},dump:()=>cache};
}

/* ================================================================ démarrage */
render();
(async()=>{
  let srv=false;
  if(location.protocol.startsWith('http')){try{const r=await fetch('api/ping',{cache:'no-store'});srv=r.ok&&(await r.json()).mode==='serveur'}catch(e){}}
  MODE=srv?'serveur':'local';db=srv?serverDb():localDb();canWrite=true;
  COLLS.forEach(c=>{db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));LOADED.add(c);lastSync=new Date();if(LOADED.size===COLLS.length)dbState='ready';schedule()})});
  schedule();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
